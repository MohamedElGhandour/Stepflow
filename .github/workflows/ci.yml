name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Proves a real consumer can require(), import(), and type-check the
      # tarball. This is the step that would have caught the v1 packaging bugs.
      - run: npm run verify-pack
